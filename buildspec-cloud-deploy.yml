version: 0.2

phases:
  install:
    commands:
      - set -eu
      - TERRAFORM_VERSION=1.16.3
      - curl --fail --silent --show-error --location "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" --output /tmp/terraform.zip
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform version
  build:
    commands:
      - cd vle6-jenkins-maven-ci/terraform
      - terraform init -input=false
      - terraform validate
      - terraform plan -input=false -out=/tmp/vle6-cloud-apply.tfplan
      - terraform apply -input=false /tmp/vle6-cloud-apply.tfplan
      - cd ..
      - python3 cloud-runner/configure_jenkins_via_ssm.py
